<style>/* Token Radar's plain theme. The palette values, two radii and three families are the whole style;
   everything else is spacing, a hairline and a type step. */
:root {
  --canvas: #faf9f6;
  --surface: #ffffff;
  --ink: #1a1a18;
  --muted: #6b675f;
  --border: #e3ddd2;
  --accent: #0b5e44;
  --negative: #a83a2c;
  --radius-control: 8px;
  --radius-panel: 14px;
  --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: Georgia, "Times New Roman", serif;
  --font-num: ui-monospace, "SF Mono", Menlo, monospace;
  --step-1: 4px;
  --step-2: 8px;
  --step-3: 12px;
  --step-4: 16px;
  --step-5: 24px;
  --step-6: 32px;
  --step-7: 48px;
}

* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  text-wrap: pretty;
}
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h1 { font-family: var(--font-display); font-size: 32px; line-height: 1.15; font-weight: 600; }
h2 { font-size: 20px; line-height: 1.2; font-weight: 600; }
h3 { font-size: 16px; line-height: 1.25; font-weight: 600; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.skip {
  position: absolute; left: -9999px; top: 0; padding: var(--step-2) var(--step-4);
  background: var(--surface); border: 1px solid var(--border); z-index: 20;
}
.skip:focus { left: var(--step-4); top: var(--step-4); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { max-width: 1320px; margin: 0 auto; padding: var(--step-5) var(--step-6) var(--step-7); }
.top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--step-5);
  padding-bottom: var(--step-4); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: var(--step-3); }
.mark { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex: none; }
.brand-name { font-family: var(--font-num); font-size: 13px; letter-spacing: 0.02em; color: var(--muted); }
.top-meta { display: flex; flex-wrap: wrap; gap: var(--step-3); justify-content: flex-end; color: var(--muted); font-size: 13px; }
.top-meta span { white-space: nowrap; }
.lede { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr); gap: var(--step-6); padding: var(--step-4) 0 var(--step-3); }
.lede p { color: var(--muted); max-width: 62ch; margin-top: var(--step-2); }
.facts { display: grid; gap: var(--step-2); align-content: start; border-left: 1px solid var(--border); padding-left: var(--step-5); }
.fact { display: flex; align-items: baseline; justify-content: space-between; gap: var(--step-3); }
.fact b { font-family: var(--font-num); font-size: 15px; font-weight: 500; }
.fact span { color: var(--muted); font-size: 13px; }

.controls { display: flex; flex-wrap: wrap; align-items: end; gap: var(--step-3); padding: var(--step-4) 0; border-top: 1px solid var(--border); }
.field { display: grid; gap: var(--step-1); }
.field label { color: var(--muted); font-size: 12px; }
.field input, .field select {
  min-height: 36px; padding: 0 var(--step-3); border: 1px solid var(--border); border-radius: var(--radius-control);
  background: var(--surface); min-width: 180px;
}
.field input { min-width: 280px; }
.tabs { display: flex; gap: var(--step-1); padding: 3px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); }
.tabs button { min-height: 30px; padding: 0 var(--step-3); border: 0; border-radius: 6px; background: transparent; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.count { margin-left: auto; color: var(--muted); font-size: 13px; align-self: center; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-panel); overflow: hidden; }
.table-wrap { overflow-x: auto; max-height: 640px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: var(--step-3) var(--step-3); border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); }
th { color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
th button { display: inline-flex; align-items: center; gap: var(--step-1); border: 0; background: none; padding: 0; color: inherit; font: inherit; }
th button:hover { color: var(--ink); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface); }
tbody tr[data-selected="true"] { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank { font-family: var(--font-num); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.expected { font-family: var(--font-num); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
th.expected-head { text-align: right; }
.name { display: grid; gap: 2px; }
.name b { font-weight: 600; }
.sub { color: var(--muted); font-size: 12px; }
.pos { color: var(--accent); }
.neg { color: var(--negative); }
.bar { width: 120px; height: 6px; border-radius: 3px; border: 1px solid var(--border); background: var(--canvas); overflow: hidden; flex: none; }
.bar i { display: block; height: 100%; background: var(--accent); }
.implied { display: flex; align-items: center; gap: var(--step-2); }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.model { margin-top: var(--step-4); padding: var(--step-5); display: grid; gap: var(--step-3); }
.formula { font-family: var(--font-num); font-size: 13px; line-height: 1.7; color: var(--muted); overflow-wrap: anywhere; }
.empty { padding: var(--step-7) var(--step-5); text-align: center; display: grid; gap: var(--step-3); justify-items: center; }
.empty p { color: var(--muted); }
.button { min-height: 36px; padding: 0 var(--step-4); border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); }
.button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }

.detail {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 92vw); z-index: 10;
  background: var(--surface); border-left: 1px solid var(--border); padding: var(--step-5);
  overflow-y: auto; transform: translateX(0); transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}
.detail[hidden] { display: none; }
.detail { margin: 0 0 0 auto; max-height: 100%; }
.detail::backdrop { background: rgba(26, 26, 24, 0.28); }
.detail-head { display: flex; align-items: start; justify-content: space-between; gap: var(--step-4); }
.detail-head > div { min-width: 0; }
.detail-head .sub { overflow-wrap: anywhere; }
.close { flex: none; min-width: 32px; min-height: 32px; padding: 0 var(--step-2); white-space: nowrap; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); }
.detail h2 { margin-top: var(--step-1); }
.detail .sub { margin-top: var(--step-1); }
.detail-section { margin-top: var(--step-5); padding-top: var(--step-4); border-top: 1px solid var(--border); }
.detail-section h3 { margin-bottom: var(--step-2); }
.equation { display: grid; gap: var(--step-2); font-family: var(--font-num); font-size: 13px; }
.equation div { display: flex; justify-content: space-between; gap: var(--step-3); }
.equation span { color: var(--muted); }
/* Waterfall: the expected-value breakdown as steps, each bar's width from the log of its value. */
.waterfall { display: grid; gap: var(--step-2); }
.wf-row { display: grid; grid-template-columns: 118px minmax(0, 1fr) auto; gap: var(--step-2); align-items: center; font-size: 12px; }
.wf-row span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-track { height: 10px; border: 1px solid var(--border); border-radius: 3px; background: var(--canvas); overflow: hidden; }
.wf-track i { display: block; height: 100%; background: var(--accent); }
.wf-track i.dim { background: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.wf-row b { font-family: var(--font-num); font-size: 12px; font-weight: 600; white-space: nowrap; }
.wf-band { font-family: var(--font-num); font-size: 13px; }
.steps { margin: 0; padding-left: var(--step-5); display: grid; gap: var(--step-3); }
.steps li { padding-left: var(--step-1); }
.steps b { display: block; font-weight: 500; }
.cost { color: var(--muted); font-size: 12px; font-family: var(--font-num); }
/* Net farm economics: expected value, farm cost and the net, in a bordered box. */
.net { display: grid; gap: var(--step-2); margin-top: var(--step-3); padding: var(--step-3) var(--step-4); border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--canvas); font-size: 13px; }
.net > div { display: flex; justify-content: space-between; gap: var(--step-3); }
.net span { color: var(--muted); }
.net b { font-family: var(--font-num); font-weight: 600; }
.net .net-pos b { color: var(--accent); font-size: 15px; }
.net .net-neg b { color: var(--negative); font-size: 15px; }

/* Headline bar: the board's key numbers in one row, no boxes, split by hairlines. */
.headline { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; padding: var(--step-3) 0; border-top: 1px solid var(--border); }
.headline-item { display: grid; gap: 1px; align-content: center; padding: 0 var(--step-4); }
/* Accounted strip: the full 758 coverage accounting in one prominent line under the headline. */
.accounted-strip {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline;
  margin-top: var(--step-3); padding: var(--step-3) var(--step-4);
  border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius-control);
  background: var(--surface); font-size: 13px;
}
.accounted-strip b { font-family: var(--font-num); font-weight: 600; white-space: nowrap; }
.accounted-strip span { color: var(--muted); }
.headline-item:first-child { padding-left: 0; }
.headline-item + .headline-item { border-left: 1px solid var(--border); }
.headline-item span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.headline-item b { font-family: var(--font-num); font-size: 17px; font-weight: 600; white-space: nowrap; }
.headline-item small { color: var(--muted); font-size: 11px; line-height: 1.4; white-space: nowrap; }
/* Scatter plot: the fit drawn as log-log SVG, between the headline and the controls. */
.scatter { margin-top: var(--step-3); padding: var(--step-4) var(--step-5); display: grid; gap: var(--step-2); }
.scatter svg { width: 100%; height: auto; display: block; }
.scatter .axis { font-family: var(--font-num); font-size: 11px; fill: var(--muted); }
.scatter .axis-title { font-size: 12px; fill: var(--muted); }
.scatter .grid { stroke: var(--border); stroke-width: 1; }
.scatter .fit-line { stroke: var(--accent); stroke-width: 2; fill: none; }
.scatter .dot { fill: color-mix(in srgb, var(--muted) 55%, var(--surface)); }
.scatter .dot-top { fill: var(--accent); }
.scatter .dot-label { font-family: var(--font-num); font-size: 11px; fill: var(--ink); }
/* Footer: a short colophon line; the coverage accounting now lives in the strip above. */
.page-foot { color: var(--muted); font-size: 13px; padding: var(--step-5) 0 var(--step-3); border-top: 1px solid var(--border); margin-top: var(--step-5); }
.page-foot b { color: var(--ink); font-family: var(--font-num); font-weight: 500; }

/* Farm verdicts: one word per row, coloured by the board's value-to-cost tertile. */
.verdict { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
.verdict.farm { background: #dff0e8; color: #0b5e44; }
.verdict.thin { background: #f7ecd2; color: #7d6212; }
.verdict.skip { background: #efede8; color: #6b675f; }

/* Sandbox and compare: the board as a tool, below the table. */
.tool { margin-top: var(--step-4); padding: var(--step-5); display: grid; gap: var(--step-3); }
.tool .row { display: flex; flex-wrap: wrap; gap: var(--step-5); align-items: end; }
.tool label { color: var(--muted); font-size: 12px; display: grid; gap: var(--step-1); }
.tool input[type="range"] { width: 180px; accent-color: var(--accent); }
.tool output { font-family: var(--font-num); font-size: 13px; color: var(--ink); }
.compare-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--step-4); }
.compare-card { border: 1px solid var(--border); border-radius: var(--radius-control); padding: var(--step-4); display: grid; gap: var(--step-2); }
.compare-card h3 { font-size: 15px; }
.compare-card dl { margin: 0; display: grid; gap: var(--step-1); font-size: 13px; }
.compare-card dl div { display: flex; justify-content: space-between; gap: var(--step-3); }
.compare-card dt { color: var(--muted); }
.compare-card dd { margin: 0; font-family: var(--font-num); }
.note { color: var(--muted); font-size: 12px; }

@media (max-width: 900px) {
  .shell { padding: var(--step-4); }
  .lede { grid-template-columns: 1fr; gap: var(--step-4); }
  .facts { border-left: 0; border-top: 1px solid var(--border); padding-left: 0; padding-top: var(--step-4); }
  .field input { min-width: 0; width: 100%; }
  .headline { gap: var(--step-2) 0; }
  .headline-item { padding: 0 var(--step-3); }
  .headline-item:first-child { padding-left: 0; }
  .compare-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}
</style>

<script>// Token Radar's dashboard (radar-4). It reads window.RADAR (written beside dashboard/ by main.ts)
// and renders the ranked board, a filterable table, a per-protocol detail drawer with the model's
// own inputs and the protocol's farm plan, plus a model sandbox, a two-protocol compare and a CSV
// export. No network: every byte it shows is in data.js.
(function () {
  'use strict';

  var DATA = window.RADAR;
  if (!DATA) return;
  var app = document.getElementById('board');
  var state = {
    q: '', category: 'all', chain: 'all', verdict: 'all', tab: 'pre-token',
    sort: 'implied', dir: -1, selected: null, sandboxOpen: false,
    sandbox: false, growthWeight: DATA.model.growth_weight, maturityFloor: DATA.model.maturity_floor,
    compareA: null, compareB: null
  };

  var usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  function fmtUsd(n) {
    if (n === null || n === undefined || !isFinite(n)) return 'n/a';
    if (Math.abs(n) >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
    if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
    if (Math.abs(n) >= 1e3) return '$' + Math.round(n / 1e3) + 'K';
    return usd.format(n);
  }
  function fmtPct(n) {
    if (n === null || n === undefined || !isFinite(n)) return 'n/a';
    return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
  }
  function fmtAge(days) {
    if (days === null || days === undefined) return 'unknown';
    if (days >= 365) return (days / 365).toFixed(1) + 'y';
    return Math.max(0, Math.round(days)) + 'd';
  }
  function fmtOdds(n) {
    if (n === null || n === undefined || !isFinite(n)) return 'n/a';
    return Math.round(n * 100) + '%';
  }

  // The model in one function: the page recomputes a row from the snapshot figures and checks the
  // number board.json carries, so the page's code and the board's data are visibly the same
  // arithmetic. radar-4: log(mcap) = intercept + slope x log(TVL) + category effect, fitted on
  // clean comps, times growth and maturity, times logistic token odds.
  function rawImpliedOf(row, growthWeight, maturityFloor) {
    var m = DATA.model;
    var growth = Math.min(m.growth_cap, Math.max(m.growth_floor, row.change_7d === null || row.change_7d === undefined ? 0 : row.change_7d));
    var growthMult = 1 + (growth / 100) * growthWeight;
    var age = row.age_days === null || row.age_days === undefined ? m.unknown_age_days : row.age_days;
    var maturity = maturityFloor + (Math.min(Math.max(age, 0), m.maturity_days) / m.maturity_days) * m.maturity_range;
    var base = Math.exp(DATA.fit.intercept + DATA.fit.slope * Math.log(row.tvl_usd) + (row.category_effect || 0));
    return { raw: Math.max(1, base * growthMult * maturity), growthMult: growthMult, maturity: maturity };
  }
  function expectedOf(row, growthWeight, maturityFloor) {
    var r = rawImpliedOf(row, growthWeight, maturityFloor);
    return Math.max(1, Math.round(r.raw * row.token_odds));
  }
  function displayedValue(row) {
    if (!state.sandbox) return row.implied_value_usd;
    return expectedOf(row, state.growthWeight, state.maturityFloor);
  }

  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'text') node.textContent = attrs[k];
        else if (k === 'html') node.innerHTML = attrs[k];
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), attrs[k]);
        else if (attrs[k] !== null && attrs[k] !== undefined) node.setAttribute(k, attrs[k]);
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var child = arguments[i];
      if (child === null || child === undefined) continue;
      if (Array.isArray(child)) child.forEach(function (c) { if (c) node.appendChild(c); });
      else if (typeof child === 'string') node.appendChild(document.createTextNode(child));
      else node.appendChild(child);
    }
    return node;
  }

  function readHash() {
    var hash = window.location.hash.replace(/^#/, '');
    if (!hash) return;
    var params = new URLSearchParams(hash);
    if (params.get('q')) state.q = params.get('q');
    if (params.get('p')) state.selected = params.get('p');
    if (params.get('category')) state.category = params.get('category');
    if (params.get('chain')) state.chain = params.get('chain');
    if (params.get('sandbox')) state.sandboxOpen = true;
  }
  function writeHash() {
    var params = new URLSearchParams();
    if (state.q) params.set('q', state.q);
    if (state.category !== 'all') params.set('category', state.category);
    if (state.chain !== 'all') params.set('chain', state.chain);
    if (state.selected) params.set('p', state.selected);
    var next = params.toString();
    if (next) window.history.replaceState(null, '', '#' + next);
    else window.history.replaceState(null, '', window.location.pathname + window.location.search);
  }

  function rows() {
    var q = state.q.trim().toLowerCase();
    return DATA.rows.filter(function (r) {
      if (state.category !== 'all' && r.category !== state.category) return false;
      if (state.chain !== 'all' && !(r.chains || []).includes(state.chain)) return false;
      if (state.verdict !== 'all' && r.verdict !== state.verdict) return false;
      if (!q) return true;
      var hay = [r.name, r.slug, r.category, (r.chains || []).join(' ')].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }
  function sortedRows(list) {
    var key = state.sort;
    return list.slice().sort(function (a, b) {
      var av, bv;
      if (key === 'name') { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
      else if (key === 'tvl') { av = a.tvl_usd; bv = b.tvl_usd; }
      else if (key === 'growth') { av = a.change_7d === null ? -Infinity : a.change_7d; bv = b.change_7d === null ? -Infinity : b.change_7d; }
      else if (key === 'age') { av = a.age_days === null ? Infinity : a.age_days; bv = b.age_days === null ? Infinity : b.age_days; }
      else if (key === 'odds') { av = a.token_odds; bv = b.token_odds; }
      else if (key === 'raw') { av = a.raw_implied_value_usd; bv = b.raw_implied_value_usd; }
      else { av = displayedValue(a); bv = displayedValue(b); }
      if (av < bv) return -state.dir;
      if (av > bv) return state.dir;
      return a.slug < b.slug ? -1 : a.slug > b.slug ? 1 : 0;
    });
  }

  function header() {
    return el('header', { class: 'top' },
      el('div', { class: 'brand' }, el('span', { class: 'mark' }), el('span', { class: 'brand-name', text: 'Token Radar' })),
      el('div', { class: 'top-meta' },
        el('span', { text: 'Snapshot ' + DATA.as_of }),
        el('span', { text: 'DefiLlama protocol index' }),
        el('span', { text: DATA.model_version + ' model' })
      )
    );
  }

  function lede() {
    var v = DATA.fit.validation;
    return el('section', { class: 'lede' },
      el('div', null,
        el('h1', { text: DATA.watchlist_size + ' watchlist protocols, ranked by expected launch value' }),
        el('p', { text: 'The watchlist is the floor: every protocol with at least $' + Math.round(DATA.floor_usd / 1e6) + 'M of TVL and no token on record. The early radar adds ' + DATA.early_size + ' pre-token protocols below that floor. Expected value is raw implied value times token odds; both are shown for every row. Implied value is a model, not a promise.' })
      ),
      el('div', { class: 'facts' },
        el('div', { class: 'fact' }, el('span', { text: 'Watchlist covered' }), el('b', { text: DATA.watchlist_size + ' / ' + DATA.watchlist_size })),
        el('div', { class: 'fact' }, el('span', { text: 'Pre-token rows scored' }), el('b', { text: String(DATA.board_size) })),
        el('div', { class: 'fact' }, el('span', { text: 'Early rows below the floor' }), el('b', { text: String(DATA.early_size) })),
        el('div', { class: 'fact' }, el('span', { text: 'Live-token protocols set aside' }), el('b', { text: String(DATA.live_size) })),
        el('div', { class: 'fact' }, el('span', { text: 'Held-out error, 5-fold CV' }), el('b', { text: 'x' + v.median_factor.toFixed(2) }))
      )
    );
  }

  function headline() {
    var v = DATA.fit.validation;
    var a = DATA.accounted;
    function item(label, value, note) {
      return el('div', { class: 'headline-item' },
        el('span', { text: label }), el('b', { text: value }),
        note ? el('small', { text: note }) : null);
    }
    return el('div', { class: 'headline' },
      item('Watchlist covered', a.board === DATA.board_size ? DATA.watchlist_size + ' / ' + DATA.watchlist_size : 'incomplete', 'every watchlist slug is on the board'),
      item('Board rows', String(DATA.board_size), DATA.watchlist_size + ' watchlist + ' + DATA.early_size + ' early'),
      item('Fitted slope', DATA.fit.slope.toFixed(2), 'log(mcap) on log(TVL), ' + DATA.fit.fitted_on + ' clean comps of ' + v.traded_n + ' traded'),
      item('Held-out error', 'x' + v.median_factor.toFixed(2), '5-fold CV median, ' + v.clean_n + ' clean comps; starter x' + v.starter_median_factor.toFixed(2)),
      item('P10-P90 coverage', Math.round(v.coverage * 100) + '%', v.coverage_n + ' of ' + v.test_n + ' held-out caps inside the band'),
      item('Snapshot', DATA.as_of, 'sealed DefiLlama index')
    );
  }

  // The coverage accounting as one prominent strip under the headline: every protocol in the
  // snapshot is accounted for somewhere, and the strip says where.
  function accountedStrip() {
    var a = DATA.accounted;
    return el('div', { class: 'accounted-strip' },
      el('b', { text: String(a.total) + ' protocols accounted for' }),
      el('span', { text: ': ' + a.board + ' on the board, ' + a.live + ' live, ' + a.traded_not_live + ' traded but below the live top ' + DATA.live_size + ', ' + a.pre_token_not_rankable + ' pre-token but not rankable, ' + a.rankable_above_floor_not_watchlist + ' rankable above the floor but not on the watchlist.' })
    );
  }

  function footer() {
    return el('footer', { class: 'page-foot' },
      'Token Radar ' + DATA.model_version + ' · Snapshot ' + DATA.as_of + ' · A static page: every number on it is in data.js, no network.'
    );
  }

  // The fit, drawn: a log-log scatter of the board rows' TVL against their raw implied value,
  // with the fitted line. The traded rows that fitted the line are not in data.js, so the dots
  // are the board's implied values, not traded market caps, and the caption says so.
  function scatter() {
    var f = DATA.fit;
    var W = 640, H = 340, L = 56, R = 16, T = 28, B = 36;
    var pw = W - L - R, ph = H - T - B;
    var x0 = Math.log(1e6), x1 = Math.log(1e10), y0 = Math.log(7e5), y1 = Math.log(1e8);
    function px(tvl) { return L + (Math.log(tvl) - x0) / (x1 - x0) * pw; }
    function py(v) { return T + (y1 - Math.log(v)) / (y1 - y0) * ph; }
    function fitY(tvl) { return Math.exp(f.intercept + f.slope * Math.log(tvl)); }
    function fmtTick(n) {
      if (n >= 1e9) return '$' + (n / 1e9) + 'B';
      if (n >= 1e6) return '$' + (n / 1e6) + 'M';
      return '$' + n;
    }
    var lineX0 = 1e6, lineX1 = 1e10;
    if (fitY(lineX1) > 1e8) lineX1 = Math.exp((Math.log(1e8) - f.intercept) / f.slope);
    if (fitY(lineX0) < 1e6) lineX0 = Math.exp((Math.log(1e6) - f.intercept) / f.slope);
    var s = [];
    s.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Log-log scatter of board rows: TVL against raw implied value, with the fitted line">');
    s.push('<defs><clipPath id="plot"><rect x="' + L + '" y="' + T + '" width="' + pw + '" height="' + ph + '"/></clipPath></defs>');
    [1e6, 1e7, 1e8, 1e9, 1e10].forEach(function (t) {
      var x = px(t).toFixed(1);
      s.push('<line class="grid" x1="' + x + '" y1="' + T + '" x2="' + x + '" y2="' + (T + ph) + '"/>');
      s.push('<text class="axis" x="' + x + '" y="' + (H - 18) + '" text-anchor="middle">' + fmtTick(t) + '</text>');
    });
    [1e6, 1e7, 1e8].forEach(function (t) {
      var y = py(t).toFixed(1);
      s.push('<line class="grid" x1="' + L + '" y1="' + y + '" x2="' + (L + pw) + '" y2="' + y + '"/>');
      s.push('<text class="axis" x="' + (L - 8) + '" y="' + (+y + 4) + '" text-anchor="end">' + fmtTick(t) + '</text>');
    });
    s.push('<text class="axis-title" x="' + (L + pw / 2) + '" y="' + (H - 2) + '" text-anchor="middle">TVL (log scale)</text>');
    s.push('<text class="axis-title" x="' + L + '" y="' + (T - 8) + '" text-anchor="start">Raw implied value (log scale)</text>');
    s.push('<g clip-path="url(#plot)"><line class="fit-line" x1="' + px(lineX0).toFixed(1) + '" y1="' + py(fitY(lineX0)).toFixed(1) + '" x2="' + px(lineX1).toFixed(1) + '" y2="' + py(fitY(lineX1)).toFixed(1) + '"/>');
    DATA.rows.forEach(function (r) {
      var top = r.rank <= 5;
      s.push('<circle class="' + (top ? 'dot-top' : 'dot') + '" cx="' + px(r.tvl_usd).toFixed(1) + '" cy="' + py(r.raw_implied_value_usd).toFixed(1) + '" r="' + (top ? 4 : 2.5) + '"/>');
    });
    s.push('</g>');
    // Top-5 labels, in rank order; a label that would land on an earlier one is shifted
    // down until it clears it, so clustered dots (Veda and Gauntlet sit close) stay readable.
    var placed = [];
    DATA.rows.filter(function (r) { return r.rank <= 5; }).forEach(function (r) {
      var x = px(r.tvl_usd), y = py(r.raw_implied_value_usd);
      var anchor = x > W - 150 ? 'end' : 'start';
      var lx = anchor === 'end' ? x - 8 : x + 8;
      var w = r.name.length * 6.6 + 4;
      var ly = y + 4, tries = 0;
      function boxFor(yy) {
        return { x0: anchor === 'end' ? lx - w : lx, x1: anchor === 'end' ? lx : lx + w, y0: yy - 11, y1: yy + 3 };
      }
      var box = boxFor(ly);
      while (tries < 5 && placed.some(function (b) { return box.x0 < b.x1 + 4 && box.x1 > b.x0 - 4 && box.y0 < b.y1 + 4 && box.y1 > b.y0 - 4; })) {
        ly += 16; box = boxFor(ly); tries++;
      }
      if (ly > H - 24) ly = H - 24;
      placed.push(boxFor(ly));
      s.push('<text class="dot-label" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + r.name.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</text>');
    });

      el('h2', { text: 'The fit, drawn' }),
      el('p', { class: 'sub', text: 'Each dot is a board row: its TVL against its raw implied value, on log scales. The line is the fitted log-log line (intercept ' + f.intercept.toFixed(2) + ', slope ' + f.slope.toFixed(2) + ') before category, growth and maturity adjustments; the dots scatter around it by those adjustments. The top five rows are named. These are implied values, not traded market caps.' }),
      el('div', { html: s.join('') })
    );
  }

  function openDetail(slug) {
    var row = DATA.rows.filter(function (r) { return r.slug === slug; })[0];
    if (!row) return;
    state.selected = slug;
    writeHash();
    dialog.textContent = '';
    var recomputed = rawImpliedOf(row, DATA.model.growth_weight, DATA.model.maturity_floor);
    var recomputedRaw = Math.max(1, Math.round(recomputed.raw));
    // Waterfall: the chain from the fitted base to the expected value. Each bar's width is
    // a log scale over the step range (12% floor plus 88% of the log span), so the odds step
    // is visibly shorter than the raw step while even a small-odds row keeps a visible bar.
    var base = recomputed.raw / (recomputed.growthMult * recomputed.maturity);
    var afterGrowth = base * recomputed.growthMult;
    var wfLo = Math.log(Math.min(base, afterGrowth, row.raw_implied_value_usd, row.implied_value_usd));
    var wfHi = Math.log(Math.max(base, afterGrowth, row.raw_implied_value_usd, row.implied_value_usd));
    function wfRow(label, value, dim) {
      var w = wfHi > wfLo ? 12 + Math.round(88 * (Math.log(Math.max(1, value)) - wfLo) / (wfHi - wfLo)) : 100;
      var bar = el('i', { style: 'width:' + w + '%' });
      if (dim) bar.className = 'dim';
      return el('div', { class: 'wf-row' },
        el('span', { text: label }),
        el('div', { class: 'wf-track' }, bar),
        el('b', { text: fmtUsd(value) }));
    }
    dialog.appendChild(el('div', { class: 'detail-head' },
      el('div', null,
        el('span', { class: 'brand-name', text: 'Rank ' + row.rank + ' of ' + DATA.board_size }),
        el('h2', { id: 'detail-title', text: row.name }),
        el('p', { class: 'sub', text: (row.category || 'Other') + ' on ' + (row.chains && row.chains.length ? row.chains.join(', ') : 'an unnamed chain') })
      ),
      el('button', { class: 'close', type: 'button', 'aria-label': 'Close details', text: 'Close', onclick: function () { dialog.close(); } })
    ));
    dialog.appendChild(el('section', { class: 'detail-section' },
      el('h3', { text: 'Expected value, term by term' }),
      el('p', { class: 'sub', text: 'TVL ' + fmtUsd(row.tvl_usd) + ' · 7-day growth ' + fmtPct(row.change_7d) + ' · Age with no token ' + fmtAge(row.age_days) + ' · Category effect ' + (row.category_effect >= 0 ? '+' : '') + row.category_effect.toFixed(2) + ' log points' }),
      el('div', { class: 'waterfall' },
        wfRow('Base from TVL', base, true),
        wfRow('x Growth ' + recomputed.growthMult.toFixed(2), afterGrowth, true),
        wfRow('x Maturity ' + recomputed.maturity.toFixed(2), row.raw_implied_value_usd, true),
        wfRow('x Odds ' + fmtOdds(row.token_odds), row.implied_value_usd, false)
      ),
      el('div', { class: 'wf-band' }, 'P10-P90 band ', el('b', { text: fmtUsd(row.p10_usd) + ' - ' + fmtUsd(row.p90_usd) })),
      el('p', { class: 'sub', text: 'Raw implied value ' + fmtUsd(row.raw_implied_value_usd) + ' is the base after growth and maturity; expected value is raw times token odds.' }),
      el('p', { class: 'sub', text: 'Token odds ' + fmtOdds(row.token_odds) + ' come from a logistic regression on log TVL, age, 7-day growth, chain count and category, fitted on all ' + DATA.accounted.total + ' protocols (5-fold CV log-loss ' + DATA.fit.odds_model.log_loss_cv.toFixed(3) + ', against ' + DATA.fit.odds_model.log_loss_blend_cv.toFixed(3) + ' for the old half-and-half blend and ' + DATA.fit.odds_model.log_loss_base_cv.toFixed(3) + ' for the base rate). Age is the time since first listing; an unlisted age uses ' + DATA.model.unknown_age_days + ' days.' }),
      el('p', { class: 'sub', text: 'Model ' + DATA.model_version + ': the page recomputes this row as ' + fmtUsd(recomputedRaw) + (recomputedRaw === row.raw_implied_value_usd ? ', the same number board.json carries.' : ', which differs from the board: the data would be stale.') + ' The band is wide because launch values vary enormously even among traded peers. This is an estimate, not a price.' })
    ));
    // Net farm economics: expected value minus what farming costs, and the raw implied value
    // at which the expected value just covers that cost (farm cost divided by token odds).
    var netValue = row.implied_value_usd - row.farm_cost_usd;
    var breakEven = row.token_odds > 0 ? row.farm_cost_usd / row.token_odds : null;
    dialog.appendChild(el('section', { class: 'detail-section' },
      el('h3', { text: 'Farm plan' }),
      el('p', { class: 'sub', text: 'Verdict ' + row.verdict + ': $' + row.farm_cost_usd + ' to farm (deposit plus gas), $' + Math.round(row.value_per_1000_cost).toLocaleString('en-US') + ' of expected value per $1,000 of cost.' }),
      el('div', { class: 'net' },
        el('div', null, el('span', { text: 'Expected value' }), el('b', { text: fmtUsd(row.implied_value_usd) })),
        el('div', null, el('span', { text: 'Farm cost' }), el('b', { text: '$' + row.farm_cost_usd })),
        el('div', { class: netValue >= 0 ? 'net-pos' : 'net-neg' }, el('span', { text: 'Net value' }), el('b', { text: (netValue < 0 ? '-' : '') + fmtUsd(Math.abs(netValue)) }))
      ),
      el('p', { class: 'sub', text: 'Break-even: farming pays off if the token launches above ' + fmtUsd(breakEven) + ' of raw implied value — at that launch value the expected value just covers the $' + row.farm_cost_usd + ' farm cost.' }),
      el('ol', { class: 'steps' }, row.farm_steps.map(function (s) {
        var at = s.indexOf(' Cost: ');
        var action = at >= 0 ? s.slice(0, at) : s;
        var tail = at >= 0 ? s.slice(at + 1) : '';
        return el('li', null, el('b', { text: action }), el('span', { class: 'cost', text: tail }));
      }))
    ));
    if (typeof dialog.showModal === 'function') {
      if (!dialog.open) dialog.showModal();
    } else {
      dialog.setAttribute('open', '');
    }
  }

  function render() {
    app.textContent = '';
    var shell = el('div', { class: 'shell' });
    shell.appendChild(header());
    shell.appendChild(lede());
    shell.appendChild(headline());
    shell.appendChild(accountedStrip());
    shell.appendChild(scatter());
    shell.appendChild(controls());
    shell.appendChild(state.tab === 'pre-token' ? boardTable() : liveTable());
    if (state.tab === 'pre-token') {
      shell.appendChild(modelPanel());
      shell.appendChild(sandboxPanel());
      shell.appendChild(comparePanel());
    }
    shell.appendChild(footer());
    app.appendChild(shell);
    app.setAttribute('aria-busy', 'false');
    if (!dialog.isConnected) app.appendChild(dialog);
    if (state.selected) openDetail(state.selected);
    // #sandbox=1 opens the page at the sandbox (once, on load): the screenshot of the
    // sandbox view lands on the panel instead of the top of the board.
    if (state.sandboxOpen && !scrolledToSandbox) {
      scrolledToSandbox = true;
      var sb = document.getElementById('sandbox');
      if (sb) sb.scrollIntoView();
    }
  }

  var scrolledToSandbox = false;
  readHash();
  render();
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && dialog.open) dialog.close();
  });
})();
</script>
</body>
</html>
